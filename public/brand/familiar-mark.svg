<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="familiar-mark-title familiar-mark-desc" color="#25232A">
  <title id="familiar-mark-title">Familiar mark</title>
  <desc id="familiar-mark-desc">An open evidence frame encloses a continuous folded loop: a compact symbol of familiar garments and traceable evidence.</desc>
  <!-- Construction source: original 64-unit geometric mark. A 5-unit open frame surrounds a 6-unit folded loop, with a diagonal return recalling a garment fold. Rounded joins preserve the silhouette at favicon size. Monochrome, editable SVG paths; no hanger, camera, font, or third-party art. Trademark clearance has not been assessed. -->
